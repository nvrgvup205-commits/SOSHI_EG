name = "soshi-eg"
main = "worker/index.ts"
compatibility_date = "2026-08-25"

# Custom build used by local `wrangler deploy` and GitHub Actions.
# Cloudflare Workers Builds ignores this block — `npm run deploy` builds the frontend instead.
[build]
command = "npm ci --prefix frontend && npm run build --prefix frontend"

# Static assets for Cloudflare Workers (React SPA)
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
API_ORIGIN = "https://soshi-eg-api.nvrgvup205.workers.dev"
